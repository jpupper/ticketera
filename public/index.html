<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ticketeadora térmica</title>
    <link rel="stylesheet" href="style.css">
    <style>

    </style>
  </head>
  <body>
    <div class="main-wrapper">
      <div class="container">
        <h1>Generador de Tickets</h1>

        <label for="printer">Seleccionar Impresora</label>
        <select id="printer" name="printer">
          <option value="">Predeterminada del sistema</option>
        </select>

        <button type="button" id="printBtn">Generar Ticket</button>
        
        <div class="status" id="status"></div>
        <div class="hint">Presiona la tecla <strong>U</strong> para generar un ticket rápidamente</div>
      </div>

      <div class="preview-container">
        <h2>Vista Previa del Ticket</h2>
        <div class="ticket-mock">
          <img src="logo.png" alt="Logo" class="ticket-logo">
          <div class="ticket-date">Fecha: <span id="previewDate">--/--/----</span></div>
          <div class="ticket-time">Hora: <span id="previewTime">--:--:--</span></div>
          <div class="ticket-separator">------------------------------</div>
          <div class="ticket-label">Nro de participante:</div>
          <div class="ticket-number" id="previewNumber">1</div>
          <div class="ticket-separator">------------------------------</div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
  </html>
